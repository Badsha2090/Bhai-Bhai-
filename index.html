function chequeDateAfterMonths(date,months=3){
 const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(date||''));
 if(!match)return todayLocal();
 const y=Number(match[1]),m=Number(match[2]),day=Number(match[3]);
 const target=new Date(y,m-1+months,1);
 const lastDay=new Date(target.getFullYear(),target.getMonth()+1,0).getDate();
 return `${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,'0')}-${String(Math.min(day,lastDay)).padStart(2,'0')}`;
}

const localDatePlusDays=days=>{const d=new Date();d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const todayLocal=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const monthNow=()=>todayLocal().slice(0,7);
const completedSalaryMonth=()=>{const [y,m]=monthNow().split('-').map(Number);return `${m===1?y-1:y}-${String(m===1?12:m-1).padStart(2,'0')}`};
// Initial partial month: 30-day payroll convention, starting day excluded (14th -> 16/30).
function salaryDue(person,month){const rate=salaryRate(person,month),start=person.startDate;if(start&&start.slice(0,7)===month){const day=Number(start.slice(8,10));if(day>1)return Math.round(rate*Math.max(0,30-day)/30*100)/100;}return rate;}
const isMonth=m=>/^\d{4}-(0[1-9]|1[0-2])$/.test(m);
const isDay=d=>/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(d)&&!Number.isNaN(Date.parse(d+'T12:00:00'));
const sum=(items,fn)=>items.reduce((n,x)=>n+Number(fn(x)||0),0);
const amountValid=x=>Number.isFinite(Number(x))&&Number(x)>0;
const salaryBy=id=>data.salaryPeople.find(x=>x.id===id);
function salaryMonths(person,through=completedSalaryMonth()){
 const first=(person.startDate||person.startMonth||through).slice(0,7),last=person.endMonth&&person.endMonth<through?person.endMonth:through;
 if(!isMonth(first)||first>last)return [];
 const result=[];let [y,m]=first.split('-').map(Number);for(let i=0;i<600;i++){
  const key=`${y}-${String(m).padStart(2,'0')}`;if(key>last)break;result.push(key);m++;if(m===13){m=1;y++}
 }return result;
}
function salaryRate(person,month){const changes=[...(person.rates||[{from:person.startMonth,amount:person.monthlySalary||0}])].filter(x=>x.from<=month).sort((a,b)=>a.from.localeCompare(b.from));return Number(changes.at(-1)?.amount||0)}
function salarySummary(person,through=completedSalaryMonth()){
 const earned=sum(salaryMonths(person,through),m=>salaryDue(person,m));
 const entries=data.salaryEntries.filter(e=>e.personId===person.id&&String(e.date||'').slice(0,7)<=monthNow());
 const paid=sum(entries.filter(e=>e.kind==='payment'),e=>e.amount);
 const adjustment=sum(entries.filter(e=>e.kind==='adjustment'),e=>e.amount);
 return {earned,paid,adjustment,balance:earned+adjustment-paid};
}
function salaryMonthlyLedger(person,through=completedSalaryMonth()){
 const months=salaryMonths(person,through);
 const entries=data.salaryEntries.filter(e=>e.personId===person.id&&String(e.date||'').slice(0,7)<=monthNow());
 // All payments (including advances) settle the oldest outstanding salary first.
 const paid=sum(entries.filter(e=>e.kind==='payment'),e=>e.amount);
 const adjustment=sum(entries.filter(e=>e.kind==='adjustment'),e=>e.amount);
 let credit=paid-adjustment;
 const rows=months.map(month=>{const due=salaryDue(person,month);const allocated=Math.min(due,Math.max(0,credit));credit-=allocated;return {month,due,allocated,remaining:due-allocated,status:due===0?'No salary':allocated>=due-0.005?'Paid':allocated>0?'Partially paid':'Unpaid'};});
 return {rows,advance:Math.max(0,credit)};
}

}

function renderBeds(roomId){const r=roomBy(roomId);if(!r||!isBedRoom(r))return;const f=flatBy(r.flatId),active=currentMonth();const beds=[...roomBeds(roomId)].sort((a,b)=>Number(a.serial||9999)-Number(b.serial||9999)||String(a.name).localeCompare(String(b.name)));const v=$('view');v.innerHTML=`<div class="line"><div class="stack"><button class="secondary" id="backBeds">← Rooms</button><h3>${esc(f?.name||'Flat')} / ${esc(r.name)} · Beds</h3></div>${isAdmin?'<button id="addBed">+ Add Bed</button>':''}</div><div class="grid"><div class="card"><div class="muted">Total Beds</div><div class="big">${beds.length}</div></div><div class="card"><div class="muted">Vacant Beds</div><div class="big">${beds.filter(b=>!b.tenant).length}</div></div><div class="card"><div class="muted">Total Due</div><div class="big">${money(active?beds.reduce((n,b)=>n+bedBalance(b.id,active),0):0)}</div></div></div>${beds.map(b=>{const due=active?bedBalance(b.id,active):0,received=active?bedPaid(b.id,active):0;const history=data.payments.filter(p=>p.bedId===b.id).sort((a,c)=>String(c.date||'').localeCompare(String(a.date||'')));return `<div class="card"><div class="line"><div><b><span class="flat-serial">#${esc(b.serial||'—')}</span>${esc(b.name||'Bed')}</b><div class="muted">${esc(b.tenant||'Vacant')} · ${money(b.rent)}/month · Deposit ${money(b.deposit)}</div><div class="muted">Check-in: ${esc(b.checkIn||'—')} · Check-out: ${esc(b.checkOut||'—')}</div>${Number(b.previousDue||0)>0?`<div class="muted" style="margin-top:5px"><b>Previous Due: ${money(b.previousDue)}</b>${b.previousDueNote?` · Note: ${esc(b.previousDueNote)}`:''}</div>`:b.previousDueNote?`<div class="muted">Note: ${esc(b.previousDueNote)}</div>`:''}</div><div class="stack">${isAdmin?`<button class="secondary" data-editbed="${esc(b.id)}">Edit</button>`:''}<button data-paybed="${esc(b.id)}">Receive Rent</button></div></div><div class="line"><div>${!b.tenant?'<span class="rent-status rent-neutral">Vacant</span>':due>0.005?`<span class="rent-status rent-due">Due ${money(due)}</span>`:due< -0.005?`<span class="rent-status rent-advance">Advance ${money(-due)}</span>`:'<span class="rent-status rent-paid">Paid</span>'}</div><div class="muted">Received this month: <b>${money(received)}</b></div></div><details><summary>Payment History (${history.length})</summary>${history.map(p=>`<div class="line" style="padding:8px;border-bottom:1px solid #ddd"><span>${esc(p.month)} · ${esc(p.date)} · ${money(p.amount)}</span><span class="pill ${p.status==='approved'?'ok':'pending'}">${esc(p.status)}</span></div>`).join('')||'<p class="muted">No payments yet</p>'}</details></div>`}).join('')||'<div class="card muted">No beds. Admin can add 9–15 beds individually.</div>'}`;$('backBeds').onclick=()=>{tab='flats';render()};if(isAdmin){$('addBed').onclick=()=>editBed(null,roomId);v.querySelectorAll('[data-editbed]').forEach(btn=>btn.onclick=()=>editBed(bedBy(btn.dataset.editbed),roomId))}v.querySelectorAll('[data-paybed]').forEach(btn=>btn.onclick=()=>newBedPayment(btn.dataset.paybed));}
function editBed(b=null,roomId){if(!isAdmin)return;const beds=roomBeds(roomId),serial=b?.serial??Math.max(0,...beds.map(x=>Number(x.serial)||0))+1;dialog(b?'Edit Bed':'Add Bed',field('Bed Name',b?.name||`Bed ${String(serial).padStart(2,'0')}`)+field('Bed Serial',serial,'number')+field('Tenant Name (Optional)',b?.tenant||'')+field('Tenant Phone (Optional)',b?.tenantPhone||'','tel')+field('Monthly Rent (AED)',b?.rent??'','number')+field('Deposit (AED)',b?.deposit??0,'number')+field('Check-in Date',b?.checkIn||'','date')+field('Check-out Date (Optional)',b?.checkOut||'','date')+field('Previous Due (AED) (Optional)',b?.previousDue??'','number')+`<label>Previous Due Note (Optional)</label><textarea data-field="Previous Due Note (Optional)" rows="3" style="width:100%;padding:11px;border:1px solid #c6d3dd;border-radius:9px">${esc(b?.previousDueNote||'')}</textarea>`+'<p class="muted">First and final months: monthly rent ÷ 30 × eligible days. Check-in and check-out dates included. Keep check-out date for past tenant records.</p>');action('Save Bed',async()=>{const x=values(),serial=Number(x['Bed Serial']),rent=Number(x['Monthly Rent (AED)']),deposit=Number(x['Deposit (AED)']),tenant=x['Tenant Name (Optional)'].trim(),checkIn=x['Check-in Date'],checkOut=x['Check-out Date (Optional)'];if(!x['Bed Name'].trim()||!Number.isInteger(serial)||serial<1||beds.some(y=>y.id!==b?.id&&Number(y.serial)===serial)||!Number.isFinite(rent)||rent<0||!Number.isFinite(deposit)||deposit<0)throw Error('Check name, unique serial and amounts');if(tenant&&!checkIn)throw Error('Enter tenant check-in date');if(checkOut&&(!checkIn||checkOut<checkIn))throw Error('Check-out must be after check-in');const previousDue=Number(x['Previous Due (AED) (Optional)']||0);if(!Number.isFinite(previousDue)||previousDue<0)throw Error('Previous Due must be zero or positive');const obj={roomId,name:x['Bed Name'].trim(),serial,tenant,tenantPhone:x['Tenant Phone (Optional)'].trim(),rent,deposit,checkIn,checkOut,previousDue,previousDueNote:x['Previous Due Note (Optional)'].trim()};if(b)await updateDoc(doc(db,'beds',b.id),obj);else await addDoc(collection(db,'beds'),obj);window.afterBedRoom=roomId});}
function newBedPayment(bedId){const b=bedBy(bedId),r=roomBy(b?.roomId);if(!b||!r)return;dialog('Receive Bed Rent · '+b.name,`<p>${esc(flatBy(r.flatId)?.name||'Flat')} / ${esc(r.name)} / ${esc(b.name)} · ${money(b.rent)}/month</p><label>Rent Month</label><select id="bedPayMonth">${allMonths().map(m=>`<option value="${esc(m)}" ${m===currentMonth()?'selected':''}>${esc(m)} · Rent ${money(bedRentForMonth(b,m))}</option>`).join('')}</select>`+field('Amount (AED)','','number')+field('Payment Date',todayLocal(),'date')+'<p class="muted">Staff payments require Admin approval.</p>');action(isAdmin?'Record Approved Payment':'Submit for Approval',async()=>{const x=values(),amount=Number(x['Amount (AED)']),month=$('bedPayMonth').value;if(!month||!Number.isFinite(amount)||amount<=0)throw Error('Choose a month and positive amount');await addDoc(collection(db,'payments'),{roomId:r.id,bedId,month,amount,date:x['Payment Date'],status:isAdmin?'approved':'pending',createdBy:user.uid,createdAt:serverTimestamp()});window.afterBedRoom=r.id});}
function paymentRow(p,compact=false){const r=roomBy(p.roomId);return `<div class="card line"><div><b>${esc(flatBy(r?.flatId)?.name||'?')} / ${esc(r?.name||'?')}${p.bedId?' / '+esc(bedBy(p.bedId)?.name||'Bed'):''}</b> · ${money(p.amount)}<div class="muted">${esc(p.month)} · ${esc(p.date)} · ${esc(p.createdBy||'')} <span class="pill ${p.status==='pending'?'pending':p.status==='approved'?'ok':''}">${esc(p.status)}</span></div></div>${isAdmin?`<div class="stack">${p.status==='pending'?`<button data-approve="${p.id}">Approve</button><button class="secondary" data-reject="${p.id}">Reject</button>`:p.status==='approved'?`<button class="danger" data-cancel="${p.id}">Cancel</button>`:''}</div>`:''}</div>`}
async function removeFlat(id){if(!isAdmin)return;const f=flatBy(id);if(!f)return;const rooms=data.rooms.filter(r=>r.flatId===id);const payments=data.payments.filter(p=>rooms.some(r=>r.id===p.roomId));const message=`Delete ${f.name} and ${rooms.length} rooms? This will also delete ${payments.length} payment records. This cannot be undone.\n\nType DELETE to confirm.`;if(prompt(message)!=='DELETE')return;const targets=[...payments.map(p=>['payments',p.id]),...rooms.map(r=>['rooms',r.id]),['flats',id]];for(let i=0;i<targets.length;i+=400){const batch=writeBatch(db);for(const [name,key] of targets.slice(i,i+400))batch.delete(doc(db,name,key));await batch.commit()}await load();toast('Flat and linked records deleted')}
function editFlat(f){const nextSerial=Math.max(0,...data.flats.map(x=>Number(x.serial)||0))+1;dialog(f?'Edit Flat':'Add Flat',field('Name',f?.name||`Flat ${String(data.flats.length+1).padStart(2,'0')}`)+field('Serial Number',f?.serial??nextSerial,'number'));action('Save',async()=>{const x=values(),Name=x.Name,serial=Number(x['Serial Number']);if(!Name.trim())throw Error('Name required');if(!Number.isInteger(serial)||serial<1)throw Error('Serial number must be a positive whole number');if(data.flats.some(a=>a.id!==f?.id&&Number(a.serial)===serial))throw Error('This serial number is already used by another flat');if(f)await updateDoc(doc(db,'flats',f.id),{name:Name.trim(),serial});else await addDoc(collection(db,'flats'),{name:Name.trim(),serial})})}
function chooseFlatForRoom(){if(!data.flats.length){toast('Add a flat first',true);return}dialog('Choose Flat',`<label>Flat</label><select id="targetFlat">${data.flats.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('')}</select>`);const b=document.createElement('button');b.textContent='Continue';b.onclick=()=>{const id=$('targetFlat').value;close();editRoom(null,id)};$('dialogBody').append(b)}
function editRoom(r,flatId){dialog(r?'Edit Room':'Add Room',field('Name',r?.name||`Room ${String(data.rooms.filter(x=>x.flatId===flatId).length+1).padStart(2,'0')}`)+field('Tenant Name (Optional)',r?.tenant||'')+field('Tenant Phone (Optional)',r?.tenantPhone||'','tel')+`<label>Room Type</label><select id="roomType"><option value="normal" ${!isBedRoom(r)?'selected':''}>Normal Room</option><option value="bedspace" ${isBedRoom(r)?'selected':''}>Bed Space Room</option></select><label>Room Status</label><select id="roomStatus"><option value="occupied" ${!isVacant(r||{})?'selected':''}>Occupied</option><option value="vacant" ${isVacant(r||{})?'selected':''}>Vacant</option></select>`+field('Monthly Rent',r?.rent||0,'number')+field('Deposit',r?.deposit||0,'number')+field('Start Month',r?.startMonth||currentMonth()||new Date().toISOString().slice(0,7),'month'));action('Save',async()=>{const x=values(),status=$('roomStatus').value;const obj={roomType:$('roomType').value,name:x.Name.trim(),tenant:x['Tenant Name (Optional)'].trim(),tenantPhone:x['Tenant Phone (Optional)'].trim(),occupancy:status,rent:Number(x['Monthly Rent']),deposit:Number(x.Deposit),startMonth:x['Start Month'],flatId:r?.flatId||flatId};if(!obj.name||!Number.isFinite(obj.deposit)||obj.deposit<0||obj.rent<0)throw Error('Invalid room');if(r&&isBedRoom(r)&&obj.roomType!=='bedspace'&&roomBeds(r.id).length)throw Error('Cannot change room type while beds exist');if(r)await updateDoc(doc(db,'rooms',r.id),obj);else await addDoc(collection(db,'rooms'),obj)})}
function newPayment(roomId){const opts=data.rooms.filter(r=>!isBedRoom(r)).map(r=>`<option value="${r.id}" ${r.id===roomId?'selected':''}>${esc(flatBy(r.flatId)?.name||'?')} / ${esc(r.name)}</option>`).join('');dialog('Receive Payment',`<label>Room</label><select id="payRoom">${opts}</select><label>Month</label><select id="payMonth">${allMonths().map(m=>`<option ${m===currentMonth()?'selected':''}>${m}</option>`).join('')}</select>${field('Amount','','number')}${field('Payment Date',new Date().toISOString().slice(0,10),'date')}<p class="muted">Staff submissions remain pending until Admin approves.</p>`);action(isAdmin?'Record Approved Payment':'Submit for Approval',async()=>{const x=values(),amount=Number(x.Amount),month=$('payMonth').value;if(!month||!$('payRoom').value||!Number.isFinite(amount)||amount<=0)throw Error('Choose room, month and valid amount');await addDoc(collection(db,'payments'),{roomId:$('payRoom').value,month,amount,date:x['Payment Date'],status:isAdmin?'approved':'pending',createdBy:user.uid,createdAt:serverTimestamp()})})}
function newMonth(){const latest=allMonths().at(-1),next=latest?(()=>{const [y,m]=latest.split('-').map(Number);return `${y+(m===12?1:0)}-${String(m===12?1:m+1).padStart(2,'0')}`})():new Date().toISOString().slice(0,7);dialog('New Month',`<p>Start ${esc(next)}? Pending payments will remain pending. Earlier balances recalculate from approved payments.</p>`);action('Confirm New Month',async()=>{if(data.months.some(m=>m.key===next))throw Error('Month already exists');const batch=writeBatch(db);for(const m of data.months.filter(m=>m.active))batch.update(doc(db,'months',m.id),{active:false});batch.set(doc(db,'months',next),{key:next,active:true,createdAt:serverTimestamp()});await batch.commit()})}
function review(id,status){const p=data.payments.find(x=>x.id===id);dialog(status==='approved'?'Approve Payment':status==='cancelled'?'Cancel Payment':'Reject Payment',`<p>${money(p.amount)} · ${esc(p.month)}</p>${field('Amount',p.amount,'number')}${field('Payment Date',p.date,'date')}${field('Reason',status==='cancelled'?'Wrong entry':'')}`);action('Confirm',async()=>{const x=values(),amount=Number(x.Amount);if(amount<=0)throw Error('Amount must be positive');await updateDoc(doc(db,'payments',id),{status,amount,date:x['Payment Date'],reviewedBy:user.uid,reviewedAt:serverTimestamp(),reason:x.Reason});await addDoc(collection(db,'audit'),{action:status,paymentId:id,previousAmount:p.amount,newAmount:amount,reason:x.Reason,by:user.uid,at:serverTimestamp()})})}
function reportRows(month){return data.rooms.map(r=>({flat:flatBy(r.flatId)?.name||'',room:r.name,tenant:r.tenant||'',rent:isBedRoom(r)?roomBeds(r.id).reduce((n,b)=>n+bedRentForMonth(b,month),0):Number(r.rent||0),received:isBedRoom(r)?roomBeds(r.id).reduce((n,b)=>n+bedPaid(b.id,month),0):paid(r.id,month),due:balance(r.id,month)}))}
function reportTable(){const m=$('reportMonth')?.value;if(!m)return;const rows=reportRows(m);$('reportTable').innerHTML=`<p>Collected: <b>${money(rows.reduce((s,r)=>s+r.received,0))}</b> · Outstanding: <b>${money(rows.reduce((s,r)=>s+r.due,0))}</b></p><div style="overflow:auto"><table width="100%" cellspacing="10"><tr><th>Flat</th><th>Room</th><th>Received</th><th>Due</th></tr>${rows.map(r=>`<tr><td>${esc(r.flat)}</td><td>${esc(r.room)}</td><td>${money(r.received)}</td><td>${money(r.due)}</td></tr>`).join('')}</table></div>`}
function exportCSV(){const m=$('reportMonth').value;const rows=[['Flat','Room','Tenant','Monthly Rent AED','Received AED','Outstanding AED'],...reportRows(m).map(r=>[r.flat,r.room,r.tenant,r.rent,r.received,r.due])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download=`monir-rent-${m}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function seedFlats(){if(!confirm('Add missing Flat 01–50?'))return;const names=new Set(data.flats.map(f=>f.name));const missing=Array.from({length:50},(_,i)=>`Flat ${String(i+1).padStart(2,'0')}`).filter(n=>!names.has(n));for(const name of missing)await addDoc(collection(db,'flats'),{name});await load();toast(`Added ${missing.length} flats`)}
function staffEmail(name){return name.toLowerCase().replace(/[^a-z0-9_-]/g,'')+'@staff.monir-real-estate.invalid'}
function createStaff(){dialog('Create Staff',field('Username')+field('6-digit PIN','','password')+'<p class="muted">Staff login uses a Firebase Authentication account. Enable Email/Password provider in Firebase Authentication before creating staff.</p>');action('Create',async()=>{const x=values(),name=x.Username.trim().toLowerCase(),pin=x['6-digit PIN'];if(!/^[a-z0-9_-]{3,24}$/.test(name)||!/^[0-9]{6}$/.test(pin))throw Error('Username 3–24 characters; PIN exactly 6 digits');const secondary=initializeApp(firebaseConfig,'staff-creation-'+Date.now());try{const result=await createUserWithEmailAndPassword(getAuth(secondary),staffEmail(name),pin);await setDoc(doc(db,'staff',result.user.uid),{username:name,active:true,canSubmit:false,createdAt:serverTimestamp()});await signOut(getAuth(secondary))}finally{await deleteApp(secondary)}})}
function editStaff(s){dialog('Staff Permissions',`<p>${esc(s.username)}</p><label><input type="checkbox" id="active" ${s.active?'checked':''} style="width:auto"> Active</label><label><input type="checkbox" id="canSubmit" ${s.canSubmit?'checked':''} style="width:auto"> Can submit payments</label>`);action('Save Permissions',()=>updateDoc(doc(db,'staff',s.id),{active:$('active').checked,canSubmit:$('canSubmit').checked}))}
$('google').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){toast(e.message,true)}};
$('staffLogin').onclick=async()=>{try{await signInWithEmailAndPassword(auth,staffEmail($('username').value),$('pin').value)}catch(e){toast('Staff sign-in failed: '+(e.code||e.message),true)}};
$('logout').onclick=()=>signOut(auth);$('theme').onclick=()=>document.body.classList.toggle('dark');
onAuthStateChanged(auth,async u=>{user=u;isAdmin=!!u&&u.uid===ADMIN_UID;staffData=null;if(u&&!isAdmin){try{const s=await getDoc(doc(db,'staff',u.uid));if(s.exists()&&s.data().active)staffData=s.data();else toast('Staff account missing or disabled. Ask Admin to check Permissions.',true)}catch(e){toast(e.message,true)}}if(u&&!isAdmin&&!staffData){if(!$('message').textContent.includes('Staff account')&&!$('message').textContent.includes('permission'))toast('Staff access denied. Check Firebase Firestore Rules and Staff Permissions.',true);await signOut(auth);return}$('login').classList.toggle('hidden',!!u);$('app').classList.toggle('hidden',!u);$('logout').classList.toggle('hidden',!u);if(u){try{await load();toast(isAdmin?'Admin signed in':'Staff signed in')}catch(e){toast('Unable to load data: '+e.message,true)}}});
if(firebaseConfig.apiKey==='REPLACE_ME')toast('Setup needed: add Firebase Web configuration and Admin UID in firebase-config.js.',true);

</script></body></html>
