<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhai Bhai Phone Sale</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf3f9;color:#17243b;font:16px system-ui,sans-serif}header{background:#143b68;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}main{max-width:720px;margin:auto;padding:14px}.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #1231}input,button{font:inherit;padding:12px;border:1px solid #c5d2df;border-radius:9px;min-width:0}input{width:100%;margin:5px 0 10px}button{background:#eaf0f8;cursor:pointer}.primary{background:#1768c4;color:white}label,small{display:block}small{color:#64748b;font-size:12px}.row{display:flex;gap:8px}.row>*{flex:1}.hidden{display:none!important}#msg{padding:10px;white-space:pre-wrap}#results button{width:100%;text-align:left;margin:4px 0}.line{border-bottom:1px solid #dbe3eb;padding:14px 0}.line label{font-size:12px}.line .row{flex-wrap:wrap}.line .row label{flex:1 1 85px}.line b{display:block;margin-bottom:8px}.send{width:100%;padding:17px;font-weight:bold}#cameraBox{position:fixed;inset:0;background:#0f172a;color:white;z-index:10;padding:14px;overflow:auto}#reader{margin-top:20px;background:#fff}button:disabled{opacity:.5}
.item-summary{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;width:100%;text-align:left;margin:6px 0;background:#f6f9fd}.item-summary.selected{border:2px solid #1768c4;background:#e9f2ff}.item-summary b{display:block;overflow-wrap:anywhere}.summary-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:5px;font-size:13px}.summary-total{display:block;margin-top:5px;font-weight:700}.editor{border:2px solid #1768c4;border-radius:12px;padding:14px;margin-bottom:18px;scroll-margin-top:12px}.editor h3{margin:0 0 12px;font-size:15px;color:#1768c4}.bill-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 8px}.bill-heading h3{margin:0;font-size:16px}.bill-heading small{font-size:13px}.version{font-size:11px;opacity:.8}
</style></head><body><header><div><strong>🛒 Bhai Bhai · Phone Sale</strong><div class="version">v1.1</div></div><button id="logout" class="hidden">Logout</button></header><main>
<form id="login" class="card"><h2>Staff Login</h2><label>Username<input id="username" autocomplete="username" required autocapitalize="none"></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Login</button></form>
<section id="app" class="hidden"><div class="card"><div class="row"><button id="scan" class="primary">📷 Scan Barcode</button><button id="refresh">Refresh Products</button></div><input id="search" placeholder="Barcode / পণ্যের নাম" autocomplete="off"><div id="results"></div></div><div class="card"><h2>Current Bill</h2><div id="lines"></div><label>Grand Total (৳)<input id="grand" type="number" min="0" step="0.01" inputmode="decimal"></label><button id="send" class="primary send">Send to POS →</button><p><small>POS থেকে বিল গ্রহণ করে Payment, Save ও Print করুন।</small></p></div></section><div id="msg" role="status"></div></main>
<div id="cameraBox" class="hidden"><button id="closeCamera">✕ Close Scanner</button><div id="reader"></div><p>ক্যামেরা চালু না হলে Barcode বা নাম লিখে পণ্য নিন।</p></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
const URL='https://rpyhkgwbhflwbjcsbpiw.supabase.co',KEY='sb_publishable_wsHzLIr68xt3pQHFIQEuEQ_ZALOHNBk',$=id=>document.getElementById(id);let token=sessionStorage.getItem('bbbm_phone_token')||'',catalog=[],cart=[],requestId=null,busy=false,scanner=null,scanBusy=false,activeIndex=-1;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(x){$('msg').textContent=x}
async function rpc(action,data={}){const r=await fetch(URL+'/rest/v1/rpc/bbbm_phone',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_action:action,p_data:{...data,token}})});const x=await r.json();if(!r.ok||x?.error)throw Error(x.message||x.error||'Request failed');return x}
function total(){return Math.round(cart.reduce((n,x)=>n+x.total,0)*100)/100}
function summary(x,i){return `<span>${i+1}.</span><span><b>${esc(x.item)}</b><span class="summary-meta"><span>Qty: ${esc(x.qty)} ${esc(x.unit)}</span><span>Rate: ৳${Number(x.price).toFixed(2)}</span></span><span class="summary-total">Total: ৳${Number(x.total).toFixed(2)}</span></span>`}
function draw(recalculate=true){
 if(recalculate)requestId=null;
 if(activeIndex<0||activeIndex>=cart.length)activeIndex=cart.length-1;
 const x=cart[activeIndex],i=activeIndex;
 const editor=x?`<div id="itemEditor" class="line editor"><h3>পণ্য ${i+1} · এডিট করুন</h3><b>${esc(x.item)}</b><small>${esc(x.unit)} · Stock ${x.current}</small><div class="row"><label>Qty<input data-i="${i}" data-k="qty" type="number" min="0.001" step="0.001" inputmode="decimal" value="${x.qty}"></label><label>Rate<input data-i="${i}" data-k="price" type="number" min="0" step="any" inputmode="decimal" value="${x.price}"></label><label>Discount %<input data-i="${i}" data-k="discount" type="number" min="0" max="100" step="any" inputmode="decimal" value="${x.discount}"></label><label>Total<input data-i="${i}" data-k="total" type="number" min="0" step="0.01" inputmode="decimal" value="${x.total}"></label></div><div class="row"><button data-cost="${i}">কেনার দাম</button><button data-remove="${i}">Remove</button></div></div>`:'';
 $('lines').innerHTML=cart.length?editor+`<div class="bill-heading"><h3>বিলের সব পণ্য</h3><small>${cart.length} items</small></div><small>এডিট করতে পণ্যের নাম চাপুন</small>`+cart.map((x,i)=>`<button type="button" class="item-summary${i===activeIndex?' selected':''}" data-edit="${i}" aria-pressed="${i===activeIndex}">${summary(x,i)}</button>`).join(''):'<p>এখনও কোনো পণ্য নেই।</p>';
 if(recalculate)$('grand').value=total().toFixed(2);
}
function showEditor(){requestAnimationFrame(()=>$('itemEditor')?.scrollIntoView({block:'start',behavior:'smooth'}))}
function add(code){if(busy)return;const x=catalog.find(x=>String(x.code)===String(code));if(!x){message('পণ্য পাওয়া যায়নি। Refresh Products চাপুন।');return}const existing=cart.find(y=>y.code===x.code);if(existing){existing.qty+=1;existing.total=Math.round(existing.qty*existing.price*(1-existing.discount/100)*100)/100;activeIndex=cart.indexOf(existing)}else{cart.push({...x,qty:1,price:+x.price||0,discount:0,total:Math.round((+x.price||0)*100)/100});activeIndex=cart.length-1}draw();$('search').value='';$('results').innerHTML='';message(x.item+' যোগ হয়েছে');showEditor()}
function search(){const q=$('search').value.trim().toLowerCase();$('results').innerHTML=q?catalog.filter(x=>String(x.code).toLowerCase().includes(q)||String(x.item).toLowerCase().includes(q)).slice(0,25).map(x=>`<button data-code="${esc(x.code)}"><b>${esc(x.item)}</b><small>${esc(x.code)} · ৳${Number(x.price).toFixed(2)} / ${esc(x.unit)} · Stock ${x.current}</small></button>`).join(''):''}
async function load(){catalog=await rpc('catalog');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');message(catalog.length?'পণ্য প্রস্তুত।':'POS-এ Phone Sale খুলে Sync Products চাপুন।')}
$('login').onsubmit=async e=>{e.preventDefault();try{const x=await rpc('login',{username:$('username').value.trim().toLowerCase(),password:$('password').value});token=x.token;sessionStorage.setItem('bbbm_phone_token',token);$('password').value='';await load()}catch(e){message(e.message)}};
$('logout').onclick=async()=>{try{await rpc('logout')}catch(_){}sessionStorage.removeItem('bbbm_phone_token');location.reload()};$('refresh').onclick=()=>load().catch(e=>message(e.message));$('search').oninput=search;$('search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add($('search').value.trim())}};
$('results').onclick=e=>{const b=e.target.closest('[data-code]');if(b)add(b.dataset.code)};
$('lines').oninput=e=>{const {i,k}=e.target.dataset;if(i===undefined||!k)return;requestId=null;const x=cart[+i],v=Number(e.target.value);x[k]=v;if(k==='total'){x.price=x.qty>0?v/x.qty:0;x.discount=0;const line=e.target.closest('.line');line.querySelector('[data-k="price"]').value=x.price;line.querySelector('[data-k="discount"]').value=0}else{x.total=Math.round(x.qty*x.price*(1-x.discount/100)*100)/100;e.target.closest('.line').querySelector('[data-k="total"]').value=x.total}$('grand').value=total().toFixed(2);$('lines').querySelector(`[data-edit="${i}"]`).innerHTML=summary(x,+i)};
$('grand').oninput=()=>requestId=null;
$('lines').onclick=async e=>{if(busy)return;const edit=e.target.closest('[data-edit]');if(edit){activeIndex=+edit.dataset.edit;draw(false);showEditor();return}const remove=e.target.closest('[data-remove]');if(remove){const i=+remove.dataset.remove;cart.splice(i,1);activeIndex=Math.min(i,cart.length-1);draw();return}const b=e.target.closest('[data-cost]');if(b)try{const x=await rpc('cost',{code:cart[+b.dataset.cost].code});b.textContent='ক্রয়মূল্য: ৳'+Number(x.cost||0).toFixed(2);setTimeout(()=>b.textContent='কেনার দাম',1000)}catch(e){message(e.message)}};
function finalItems(){const grand=Number($('grand').value),sum=total();if(!cart.length||!Number.isFinite(grand)||grand<0||Math.abs(grand*100-Math.round(grand*100))>0.00001)throw Error('সঠিক Total লিখুন');if(cart.some(x=>!Number.isFinite(x.qty)||x.qty<=0||!Number.isFinite(x.total)||x.total<0||!Number.isFinite(x.discount)||x.discount<0||x.discount>100))throw Error('Qty/Rate/Discount ঠিক করুন');const counts={};cart.forEach(x=>counts[x.code]=(counts[x.code]||0)+x.qty);if(cart.some(x=>counts[x.code]>x.current))throw Error('পর্যাপ্ত Stock নেই। Refresh Products চাপুন।');const cents=Math.round(grand*100);if(sum<=0&&cents>0)throw Error('আগে পণ্যের দাম দিন');const parts=cart.map((x,i)=>{const exact=sum?cents*x.total/sum:0;return {i,whole:Math.floor(exact),rem:exact-Math.floor(exact)}});let left=cents-parts.reduce((n,x)=>n+x.whole,0);parts.sort((a,b)=>b.rem-a.rem||a.i-b.i);for(let i=0;i<left;i++)parts[i%parts.length].whole++;return cart.map((x,i)=>({code:x.code,qty:x.qty,total:parts.find(p=>p.i===i).whole/100}))}
$('send').onclick=async()=>{if(busy)return;try{const items=finalItems();if(!requestId)requestId=crypto.randomUUID();busy=true;$('app').inert=true;$('send').disabled=true;await rpc('send',{id:requestId,items});cart=[];draw();message('✅ POS-এ পাঠানো হয়েছে। POS → Phone Sale → Receive চাপুন।')}catch(e){message(e.message)}finally{busy=false;$('app').inert=false;$('send').disabled=false}};
async function stopScan(){if(scanner){try{await scanner.stop();await scanner.clear()}catch(_){}scanner=null}$('cameraBox').classList.add('hidden')}
$('closeCamera').onclick=stopScan;$('scan').onclick=async()=>{try{if(!window.Html5Qrcode)throw Error('Scanner load হয়নি। Barcode লিখে দিন।');$('cameraBox').classList.remove('hidden');scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:160}},async code=>{if(scanBusy)return;scanBusy=true;try{add(code);await stopScan()}finally{scanBusy=false}})}catch(e){message('ক্যামেরা চালু হয়নি। HTTPS লিংক ও Camera permission পরীক্ষা করুন।');await stopScan()}};
if(token)load().catch(e=>{sessionStorage.removeItem('bbbm_phone_token');token='';message(e.message)});
</script></body></html>
